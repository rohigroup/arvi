<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080c10" />
    <meta
      name="description"
      content="Arvi reúne inteligencia artificial, automatización y formación práctica para negocios, emprendedores y equipos."
    />
    <meta property="og:title" content="Arvi | Automatiza, aprende y vive" />
    <meta
      property="og:description"
      content="Encuentra Arvi Agente IA, Arvi Academy, masterclasses y contacto en un solo lugar."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://arvi.rohigroup.co/" />
    <title>Arvi | Automatiza, aprende y vive</title>
    <link rel="canonical" href="https://arvi.rohigroup.co/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/hub.css" />
    <script src="/router.js"></script>
    <script src="/links.js" defer></script>
    <script src="/hub.js" defer></script>
  </head>
  <body>
    <div class="page-glow" aria-hidden="true"></div>
    <main class="hub-shell">
      <header class="profile">
        <a class="brand" href="/" aria-label="Arvi">
          <span class="brand-dot" aria-hidden="true"></span>
          <span>arvi<span class="brand-accent">.</span></span>
        </a>

        <div class="avatar" aria-hidden="true">
          <span class="avatar-screen"><i></i><i></i></span>
          <span class="avatar-signal"></span>
        </div>

        <p class="profile-kicker" id="profileKicker">IA · Automatización · Formación</p>
        <h1 id="profileTitle">Tecnología que trabaja contigo, no encima de ti.</h1>
        <p class="profile-copy" id="profileCopy">
          Soluciones y formación práctica para organizar tu negocio, responder mejor y recuperar tiempo.
        </p>
      </header>

      <section class="featured hidden" id="featuredCard" aria-labelledby="featuredTitle">
        <div class="featured-topline">
          <span class="featured-pill" id="featuredBadge">Destacado</span>
          <span class="featured-arrow" aria-hidden="true">↗</span>
        </div>
        <h2 id="featuredTitle"></h2>
        <p id="featuredDescription"></p>
        <a class="featured-button" id="featuredButton" href="#">Abrir</a>
      </section>

      <section aria-label="Enlaces principales">
        <div class="links-list" id="linksList"></div>
      </section>

      <footer class="hub-footer">
        <div class="footer-links" id="footerLinks"></div>
        <p>Una iniciativa de Arvi y Rohi Group.</p>
        <strong>Automatiza y vive.</strong>
      </footer>
    </main>
  </body>
</html>
