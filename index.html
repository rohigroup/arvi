<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="description" content="Todo Arvi en un solo lugar: agentes de inteligencia artificial, automatización y formación práctica." />
  <meta property="og:title" content="Arvi | Automatiza y vive" />
  <meta property="og:description" content="Agentes IA, automatización y formación práctica para recuperar tiempo." />
  <meta property="og:type" content="website" />
  <title>Arvi | Automatiza y vive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://app.rohigroup.co" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/hub.css" />
</head>
<body>
  <div class="page-glow page-glow-green" aria-hidden="true"></div>
  <div class="page-glow page-glow-violet" aria-hidden="true"></div>

  <main class="hub-shell">
    <header class="brand-bar">
      <a class="brand-link" href="/" aria-label="Inicio de Arvi">
        <img class="brand-logo" src="https://app.rohigroup.co/brand/logo-arvi.png" alt="Arvi" />
      </a>
      <button class="share-button" id="shareButton" type="button" aria-label="Compartir Arvi">
        <span class="share-icon" aria-hidden="true"></span>
        <span>Compartir</span>
      </button>
      <p class="share-status" id="shareStatus" role="status" aria-live="polite"></p>
    </header>

    <section class="hero" aria-labelledby="profileTitle">
      <div class="hero-copy">
        <p class="eyebrow" id="profileKicker"></p>
        <h1 id="profileTitle"></h1>
        <p class="hero-description" id="profileDescription"></p>
        <p class="brand-promise">Automatiza <span aria-hidden="true">✦</span> y vive.</p>
      </div>

      <div class="hero-mark" aria-hidden="true">
        <div class="mark-orbit mark-orbit-one"></div>
        <div class="mark-orbit mark-orbit-two"></div>
        <img src="https://app.rohigroup.co/brand/isotipo-arvi.png" alt="" />
        <span class="pixel pixel-one"></span>
        <span class="pixel pixel-two"></span>
        <span class="pixel pixel-three"></span>
      </div>
    </section>

    <section class="featured" aria-labelledby="featuredTitle">
      <a class="featured-card tracked-link" id="featuredLink" href="#">
        <div class="featured-content">
          <div class="featured-topline">
            <span class="live-dot" aria-hidden="true"></span>
            <span id="featuredEyebrow"></span>
          </div>
          <h2 id="featuredTitle"></h2>
          <p id="featuredDescription"></p>
          <div class="featured-meta-row">
            <span id="featuredMeta"></span>
            <span class="featured-arrow" aria-hidden="true">↗</span>
          </div>
        </div>
        <div class="featured-shape" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
      </a>
    </section>

    <section class="pathways" aria-labelledby="pathwaysTitle">
      <div class="section-heading">
        <p class="section-kicker">Encuentra tu camino</p>
        <h2 id="pathwaysTitle">¿Qué quieres hacer hoy?</h2>
      </div>
      <div class="link-grid" id="links"></div>
    </section>

    <section class="identity-strip" aria-label="La propuesta de Arvi">
      <article>
        <span class="identity-number">01</span>
        <div><strong>Aprende</strong><p>Tecnología explicada sin enredos.</p></div>
      </article>
      <article>
        <span class="identity-number">02</span>
        <div><strong>Aplica</strong><p>Soluciones para problemas reales.</p></div>
      </article>
      <article>
        <span class="identity-number">03</span>
        <div><strong>Automatiza</strong><p>Recupera tiempo para vivir mejor.</p></div>
      </article>
    </section>

    <footer class="hub-footer">
      <div class="footer-brand">
        <img src="https://app.rohigroup.co/brand/isotipo-arvi.png" alt="" />
        <div><strong>Arvi</strong><span>Una iniciativa de Rohi Group</span></div>
      </div>
      <nav class="footer-links" id="footerLinks" aria-label="Contacto y enlaces secundarios"></nav>
      <p class="footer-note">Inteligencia artificial con criterio humano.</p>
    </footer>
  </main>

  <script src="/links.js" defer></script>
  <script src="/hub.js" defer></script>
</body>
</html>
